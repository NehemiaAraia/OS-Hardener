[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "os-hardening-platform"
version = "0.1.0"
description = "Cross-platform CIS/NIST hardening scanner, scorer, and remediator for Windows Server and RHEL"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pywinrm>=0.4",
    "paramiko>=3.0",
    "flask>=3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "bandit>=1.7"]

[tool.setuptools]
packages = ["scanner", "scanner.connection", "scanner.remediation"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# B404: importing subprocess is required to invoke ansible-playbook. Every call
# site is reviewed individually with its own nosec and justification.
skips = ["B404"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
# S603/S607 duplicate the Bandit findings already justified at their call sites
ignore = ["S603", "S607"]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; the "passwords" there are fixture values
"tests/*" = ["S101", "S105", "S106", "S107"]
# long lines in the embedded HTML template are markup, not logic
"scanner/reporter.py" = ["E501"]
"dashboard.py" = ["E501"]

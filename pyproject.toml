[project]
name = "os-hardening-platform"
version = "0.1.0"
description = "Cross-platform CIS/NIST hardening scanner, scorer, and remediator for Windows Server and RHEL"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pywinrm>=0.4",
    "paramiko>=3.0",
    "flask>=3.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "bandit>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

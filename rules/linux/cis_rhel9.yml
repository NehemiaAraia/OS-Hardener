policy:
  id: cis_rhel9
  name: CIS Red Hat Enterprise Linux 9 Benchmark
  platform: linux

requirements:
  description: RHEL 9, scanned over SSH (key-based) as svc-hardening-scanner

checks:
  - id: LNX-5.2.8
    title: root SSH login disabled
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_AC-6_2
    condition: all
    remediation: Set 'PermitRootLogin no' in /etc/ssh/sshd_config and reload sshd.
    references:
      - CIS 5.2.8
    rules:
      - "cmd:sudo -n /usr/local/sbin/hardening-scan-helper sshd-config -> regex:^\\s*PermitRootLogin\\s+no\\b"

  - id: LNX-5.2.9
    title: SSH password authentication disabled (key-only)
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_IA-5_2
    condition: all
    remediation: Set 'PasswordAuthentication no' in /etc/ssh/sshd_config and reload sshd.
    references:
      - CIS 5.2.9
    rules:
      - "cmd:sudo -n /usr/local/sbin/hardening-scan-helper sshd-config -> regex:^\\s*PasswordAuthentication\\s+no\\b"

  - id: LNX-3.5.1
    title: host firewall active
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_SC-7
    condition: any
    remediation: Enable firewalld (systemctl enable --now firewalld) or nftables.
    references:
      - CIS 3.5.1
    rules:
      - "svc:firewalld -> running:"
      - "svc:nftables -> running:"

  - id: LNX-6.1.1
    title: /etc/passwd permissions (<= 0644)
    level: level1
    scored: scored
    scope: server
    severity: medium
    nist: NIST800-53R5_AC-3
    condition: all
    remediation: chown root:root /etc/passwd && chmod 0644 /etc/passwd
    references:
      - CIS 6.1.1
    rules:
      - "perm:/etc/passwd -> maxmode:0644"

  - id: LNX-6.1.2
    title: /etc/shadow permissions (<= 0640)
    level: level1
    scored: scored
    scope: server
    severity: medium
    nist: NIST800-53R5_AC-3
    condition: all
    remediation: chown root:root /etc/shadow && chmod 0000 /etc/shadow
    references:
      - CIS 6.1.2
    rules:
      - "perm:/etc/shadow -> maxmode:0640"

  - id: LNX-6.1.10
    title: No world-writable files
    level: level2
    scored: scored
    scope: server
    severity: medium
    nist: NIST800-53R5_AC-3
    condition: all
    description: >
      Runs through the root-owned helper — an unprivileged find silently skips
      directories it can't read and would under-report.
    remediation: Remove the world-writable bit (chmod o-w) from the listed files.
    references:
      - CIS 6.1.10
    rules:
      - "cmd:sudo -n /usr/local/sbin/hardening-scan-helper world-writable -> maxint:0"

  - id: LNX-6.1.13
    title: SUID/SGID binary audit
    level: level2
    scored: notscored
    scope: server
    severity: medium
    nist: NIST800-53R5_CM-7
    condition: all
    manual: true
    description: >
      A stock system legitimately ships SUID/SGID binaries, so there's no correct
      pass/fail baseline — the list is collected and put in front of a reviewer.
    remediation: Compare the listed binaries against the expected set for this build.
    references:
      - CIS 6.1.13
    rules:
      - "cmd:sudo -n /usr/local/sbin/hardening-scan-helper suid -> exists:"

  - id: LNX-2.2.1
    title: Legacy services not installed (telnet, rsh, ftp)
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_CM-7
    condition: all
    description: >
      'grep -c' exits non-zero when it matches nothing, even though 0 is the
      correct answer — '|| true' keeps a compliant host from looking like a
      failed probe.
    remediation: dnf remove telnet-server rsh-server vsftpd
    references:
      - CIS 2.2.1
    rules:
      - "cmd:rpm -qa | grep -Ec '^(telnet-server|rsh-server|vsftpd)-' || true -> equals:0"

  - id: LNX-5.4.1
    title: Password policy (minlen 14+)
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_IA-5_1_a
    condition: all
    description: >
      An unset minlen returns no value, which reports WARN rather than passing —
      absence of a policy is not evidence of a compliant one.
    remediation: Set 'minlen = 14' in /etc/security/pwquality.conf
    references:
      - CIS 5.4.1
    rules:
      - "cmd:grep -E '^\\s*minlen' /etc/security/pwquality.conf 2>/dev/null | awk -F= '{print $2}' | tr -d ' ' -> minint:14"

  - id: LNX-5.3.4
    title: Sudoers audit (no NOPASSWD:ALL)
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_AC-6_5
    condition: all
    description: >
      /etc/sudoers is mode 0440, so an unprivileged read fails; the helper runs it
      as root and prints nothing on failure, which reports WARN. Counting matches
      client-side would have turned a permission error into a fabricated zero and
      made this control impossible to fail. The scanner's own sudoers entry is
      verb-scoped, so it does not trip this control.
    remediation: Remove blanket NOPASSWD:ALL grants from /etc/sudoers and /etc/sudoers.d.
    references:
      - CIS 5.3.4
    rules:
      - "cmd:sudo -n /usr/local/sbin/hardening-scan-helper sudoers -> maxint:0"

  - id: LNX-4.1.1
    title: auditd and rsyslog running
    level: level1
    scored: scored
    scope: server
    severity: medium
    nist: NIST800-53R5_AU-2
    condition: all
    remediation: systemctl enable --now auditd rsyslog
    references:
      - CIS 4.1.1.1
      - CIS 4.2.1.1
    rules:
      - "svc:auditd -> running:"
      - "svc:rsyslog -> running:"

  - id: LNX-1.9
    title: Patch recency (last update within 35 days)
    level: level1
    scored: scored
    scope: server
    severity: high
    nist: NIST800-53R5_SI-2
    condition: all
    description: >
      Age is computed on the host from the newest package install time, so the
      result doesn't depend on the scanner's clock.
    remediation: dnf update
    references:
      - CIS 1.9
    rules:
      - "cmd:echo $(( ( $(date +%s) - $(rpm -qa --qf '%{INSTALLTIME}\\n' | sort -n | tail -1) ) / 86400 )) -> maxint:35"

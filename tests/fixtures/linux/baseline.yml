echo $(( ( $(date +%s) - $(rpm -qa --qf '%{INSTALLTIME}\n' | sort -n | tail -1) ) / 86400 )):
  exit_status: 0
  stdout: '3'
grep -E '^\s*minlen' /etc/security/pwquality.conf 2>/dev/null | awk -F= '{print $2}' | tr -d ' ':
  exit_status: 1
  stdout: ''
rpm -qa | grep -Ec '^(telnet-server|rsh-server|vsftpd)-' || true:
  exit_status: 0
  stdout: '1'
stat -c '%a' /etc/passwd:
  exit_status: 0
  stdout: '644'
stat -c '%a' /etc/shadow:
  exit_status: 0
  stdout: '0'
sudo -n /usr/local/sbin/hardening-scan-helper sshd-config:
  exit_status: 0
  stdout: 'PermitRootLogin yes

    PasswordAuthentication yes

    Port 22

    '
sudo -n /usr/local/sbin/hardening-scan-helper sudoers:
  exit_status: 0
  stdout: '1'
sudo -n /usr/local/sbin/hardening-scan-helper suid:
  exit_status: 0
  stdout: '/usr/bin/sudo

    /usr/bin/passwd

    /usr/bin/su'
sudo -n /usr/local/sbin/hardening-scan-helper world-writable:
  exit_status: 0
  stdout: '3'
systemctl is-active auditd:
  exit_status: 0
  stdout: active
systemctl is-active firewalld:
  exit_status: 3
  stdout: inactive
systemctl is-active nftables:
  exit_status: 3
  stdout: inactive
systemctl is-active rsyslog:
  exit_status: 3
  stdout: inactive

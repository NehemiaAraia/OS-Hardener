? $a=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);
  if(-not $a){''}else{(Get-BitLockerVolume -MountPoint $env:SystemDrive).ProtectionStatus}
: exit_status: 0
  stdout: 'Off'
? $a=([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator);
  if(-not $a){''}else{[int]((Get-Date) - (Get-HotFix | Sort-Object InstalledOn -Descending
  | Select-Object -First 1).InstalledOn).TotalDays}
: exit_status: 0
  stdout: '12'
? $v=(Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
  -Name SMB1 -EA SilentlyContinue).SMB1; if($null -eq $v){'absent'}else{$v}
: exit_status: 0
  stdout: '0'
(Get-LocalUser -Name 'Guest').Enabled:
  exit_status: 0
  stdout: 'False'
(auditpol /get /subcategory:'Logon' | Select-String '  Logon').Line:
  exit_status: 0
  stdout: '  Logon                    Success and Failure'
(net accounts | Select-String 'Minimum password length').Line.Split(':')[1].Trim():
  exit_status: 0
  stdout: '14'
? '@(''DomainProfile'',''StandardProfile'',''PublicProfile'') | Where-Object { (Get-ItemProperty
  (''HKLM:\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy\''
  + $_) -Name EnableFirewall -EA SilentlyContinue).EnableFirewall -ne 1 } | Measure-Object
  | Select-Object -ExpandProperty Count'
: exit_status: 0
  stdout: '0'
? '@(''TlntSvr'',''RemoteRegistry'') | Where-Object { $p = ''HKLM:\SYSTEM\CurrentControlSet\Services\''
  + $_; (Test-Path $p) -and ((Get-ItemProperty $p -Name Start -EA SilentlyContinue).Start
  -ne 4) } | Measure-Object | Select-Object -ExpandProperty Count'
: exit_status: 0
  stdout: '0'
? Get-ItemPropertyValue -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
  -Name 'UserAuthentication'
: exit_status: 0
  stdout: '1'
Get-LocalGroupMember -Group 'Administrators' | Select-Object -ExpandProperty Name:
  exit_status: 0
  stdout: Administrator
? secedit /export /cfg $env:TEMP\sec.cfg | Out-Null; (Select-String -Path $env:TEMP\sec.cfg
  -Pattern 'PasswordComplexity').Line.Split('=')[1].Trim()
: exit_status: 0
  stdout: '1'

---
# Scoped to SSH hardening and the host firewall. Structure follows
# ansible-lockdown's RHEL9-CIS (tagged tasks, check-before-act, handlers for
# service reloads) without copying its content.
#
# Run through the scanner CLI rather than directly:
#   python main.py remediate --target linux --host <ip> --dry-run
- name: Linux CIS remediation
  hosts: all
  become: true
  gather_facts: false

  vars:
    sshd_config: /etc/ssh/sshd_config

  handlers:
    - name: reload sshd
      ansible.builtin.service:
        name: sshd
        state: reloaded

  tasks:
    - name: Disable root SSH login
      ansible.builtin.lineinfile:
        path: "{{ sshd_config }}"
        regexp: '^\s*#?\s*PermitRootLogin\s+'
        line: 'PermitRootLogin no'
        validate: '/usr/sbin/sshd -t -f %s'
        backup: true
      notify: reload sshd
      tags: [LNX-SSH-ROOT, ssh]

    - name: Disable SSH password authentication
      ansible.builtin.lineinfile:
        path: "{{ sshd_config }}"
        regexp: '^\s*#?\s*PasswordAuthentication\s+'
        line: 'PasswordAuthentication no'
        validate: '/usr/sbin/sshd -t -f %s'
        backup: true
      notify: reload sshd
      tags: [LNX-SSH-PASSAUTH, ssh]

    - name: Ensure firewalld is installed
      ansible.builtin.package:
        name: firewalld
        state: present
      tags: [LNX-FIREWALL, firewall]

    # written offline, before the service starts, bringing up a firewall on a
    # host you reach over SSH without first guaranteeing SSH is permitted is how
    # you lock yourself out of a machine you are in the middle of hardening
    - name: Permit SSH in the default zone before the firewall comes up
      ansible.builtin.command: firewall-offline-cmd --add-service=ssh
      register: fw_ssh
      changed_when: "'ALREADY_ENABLED' not in fw_ssh.stderr"
      failed_when: fw_ssh.rc != 0 and 'ALREADY_ENABLED' not in fw_ssh.stderr
      tags: [LNX-FIREWALL, firewall]

    - name: Enable and start firewalld
      ansible.builtin.service:
        name: firewalld
        state: started
        enabled: true
      tags: [LNX-FIREWALL, firewall]

    - name: Ensure audit and logging daemons are running
      ansible.builtin.service:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - auditd
        - rsyslog
      tags: [LNX-AUDIT-LOG, logging]

    - name: Enforce a minimum password length
      ansible.builtin.lineinfile:
        path: /etc/security/pwquality.conf
        regexp: '^\s*#?\s*minlen\s*='
        line: 'minlen = 14'
        create: true
        mode: '0644'
      tags: [LNX-PW-MINLEN, password]

    # mode only, deliberately not touching ownership or content, so a
    # misconfigured system is corrected without rewriting account data
    - name: Correct /etc/passwd permissions
      ansible.builtin.file:
        path: /etc/passwd
        owner: root
        group: root
        mode: '0644'
      tags: [LNX-PASSWD-PERMS, permissions]

    - name: Correct /etc/shadow permissions
      ansible.builtin.file:
        path: /etc/shadow
        owner: root
        group: root
        mode: '0000'
      tags: [LNX-SHADOW-PERMS, permissions]
